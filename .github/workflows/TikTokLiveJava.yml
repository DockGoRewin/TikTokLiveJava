name: Build TikTokLiveJava JAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build extractor
        run: ./gradlew :extractor:jar --no-daemon

      - name: Collect JAR files
        run: |
          mkdir -p output
          cp extractor/build/libs/*.jar output/
          ls -lh output/

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveJava
          path: output/*.jar
          if-no-files-found: error
          retention-days: 7
