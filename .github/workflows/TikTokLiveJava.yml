name: Build TikTokLiveJava JAR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TikTokLiveJava
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Collect JAR files
        run: |
          mkdir -p output
          find . -path '*/target/*.jar' \
            ! -name 'original-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            -exec cp {} output/ \;
          ls -lh output/

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TikTokLiveJava
          path: output/*.jar
          if-no-files-found: error
          retention-days: 7
